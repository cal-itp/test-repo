name: "Add issues to project"

on:
  issues:
    types: [opened]

jobs:
  add-to-project-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@main
        with:
          project-url: ${{ secrets.USB_PROJECT_URL }}
          github-token: ${{ secrets.USB_PROJECT_TOKEN }}
